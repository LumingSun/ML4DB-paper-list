# Lexicon and mapping tables for the AI4DB paper pipeline.
# Everything here is data, not code: tune freely, the tests only depend on
# the *shape* of the file.  See docs/superpowers/specs/ for the design.

# Candidate must match at least one DB term AND one AI term (case
# insensitive substring on title + abstract) to reach the model.
db_terms:
  - database
  - dbms
  - query
  - sql
  - index
  - join
  - cardinality
  - optimizer
  - query plan
  - schema
  - workload
  - transaction
  - storage engine
  - knob
  - tuning
  - partition
  - materialized view
  - buffer pool
  - data warehouse
  - oltp
  - olap
  - tuple
  - relation
  - tables
  - oltp
  - data management
  - data analytics
  - columnar
  - lsm
  - b-tree
  - key-value

ai_terms:
  - machine learning
  - learned
  - learning
  - neural
  - deep learning
  - transformer
  - llm
  - large language model
  - language model
  - gpt
  - agent
  - reinforcement
  - ml
  - embedding
  - bert
  - fine-tun
  - prompt
  - foundation model
  - ai

# Hard exclusions: topics the list deliberately does not collect.
exclude_terms:
  - vector database
  - vector search
  - approximate nearest neighbor
  - ann search
  - retrieval-augmented
  - retrieval augmented
  - graphrag
  - graph rag
  - knowledge graph completion
  - recommender system
  - recommendation system

# Crossref container title -> the venue spelling used in the README.
# Matching is case-insensitive substring; first hit wins.
venue_map:
  - match: "Proceedings of the VLDB Endowment"
    venue: VLDB
  - match: "Proceedings of the ACM on Management of Data"
    venue: SIGMOD
  - match: "ACM SIGMOD International Conference on Management of Data"
    venue: SIGMOD
  - match: "Companion of the ACM SIGMOD"
    venue: SIGMOD-Companion
  - match: "International Conference on Data Engineering"
    venue: ICDE
  - match: "IEEE Transactions on Knowledge and Data Engineering"
    venue: TKDE
  - match: "VLDB Journal"
    venue: VLDBJ
  - match: "Transactions on Database Systems"
    venue: TODS
  - match: "SIGMOD Record"
    venue: SIGMOD Record
  - match: "Conference on Innovative Data Systems Research"
    venue: CIDR

# Crossref containers to pull.  `match` is the exact container-title we
# filter on; `venue` is what the entry will say.
crossref_containers:
  - match: "Proceedings of the VLDB Endowment"
    venue: VLDB
  - match: "Proceedings of the ACM on Management of Data"
    venue: SIGMOD
  - match: "IEEE Transactions on Knowledge and Data Engineering"
    venue: TKDE
  - match: "The VLDB Journal"
    venue: VLDBJ
  - match: "International Conference on Data Engineering"
    venue: ICDE

# arXiv queries.  cs.DB catches the bulk; Text-to-SQL largely lives in
# cs.CL/cs.LG, hence the explicit keyword queries.
arxiv_queries:
  - 'cat:cs.DB'
  - 'all:"text-to-sql"'
  - 'all:"nl2sql"'
  - 'all:"database" AND (all:"large language model" OR all:"LLM")'
  - 'all:"learned" AND (all:"query optimizer" OR all:"cardinality estimation")'

# Fuzzy duplicate threshold (0-100) on normalised tokens.  92 means
# "same paper, different casing/punctuation"; lower catches paraphrases
# but starts colliding distinct papers.
duplicate_threshold: 92

# Look-back windows (days).  Fixed windows instead of a watermark: ACM /
# IEEE indexing lags publication by months, and a strict watermark would
# silently skip late-indexed papers forever.
arxiv_lookback_days: 120
crossref_lookback_days: 180

# Maximum candidates sent to the model per run (cost guard).
max_candidates_per_run: 800
